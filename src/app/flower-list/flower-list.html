<h2>Flower List</h2>

<table>
  @for (flower of flowers; track $index) {
    <tr>
      <td>
        <a routerLink="/flowers/{{flower.id}}">
          <img class="thumb" src="/images/flowers/{{flower.picture.small}}" alt="{{flower.id}} image">
        </a>
      </td>
      <td>
        <p>
          <span class="flower_label">{{ flower.label }}</span>
          <span class="flower_price">{{ flower.price | currency}}</span>
        </p>
        <p>
          <a  class="flower_details_link"
              routerLink="/flowers/{{flower.id}}">Details</a>
        </p>
      </td>
    </tr>
  }
</table>
